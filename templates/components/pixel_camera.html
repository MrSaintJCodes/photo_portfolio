<div class="pixel-camera-backdrop" data-pixel-camera-backdrop aria-hidden="true" hidden></div>
<div class="pixel-camera" data-pixel-camera aria-hidden="true" hidden>
  <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 32" width="96" height="64" shape-rendering="crispEdges" focusable="false">
    <g class="pixel-camera-body">
      <rect x="6" y="13" width="36" height="15" fill="var(--color-paper)"/>
      <rect x="4" y="15" width="40" height="11" fill="var(--color-paper)"/>
      <rect x="7" y="15" width="34" height="11" fill="var(--color-ink)"/>
      <rect x="7" y="18" width="5" height="8" fill="var(--color-muted)"/>
      <rect x="17" y="9" width="13" height="6" fill="var(--color-paper)"/>
      <rect x="20" y="11" width="7" height="3" fill="var(--color-muted)"/>
      <rect x="8" y="15" width="4" height="2" fill="var(--color-accent-light)"/>
      <rect x="34" y="24" width="5" height="1" fill="var(--color-muted)"/>
    </g>
    <g class="pixel-camera-shutter"><rect x="10" y="10" width="5" height="3" fill="var(--color-accent-light)"/></g>
    <g class="pixel-camera-lens" fill="var(--color-paper)">
      <rect x="20" y="15" width="7" height="12"/><rect x="18" y="17" width="11" height="8"/>
      <rect x="21" y="17" width="5" height="8" fill="var(--color-muted)"/><rect x="20" y="19" width="7" height="4" fill="var(--color-muted)"/>
      <rect x="22" y="19" width="3" height="4" fill="var(--color-ink)"/><rect x="22" y="19" width="2" height="1" fill="var(--color-accent-light)"/>
    </g>
    <g class="pixel-camera-flash-unit" fill="var(--color-paper)">
      <rect x="33" y="8" width="8" height="6"/><rect x="35" y="10" width="4" height="2" fill="var(--color-muted)"/>
      <g class="pixel-camera-burst"><rect x="35" y="9" width="4" height="3"/><rect x="36" y="2" width="2" height="4"/><rect x="43" y="7" width="4" height="2"/><rect x="29" y="5" width="3" height="2"/><rect x="43" y="13" width="3" height="2"/></g>
    </g>
  </svg>
</div>
